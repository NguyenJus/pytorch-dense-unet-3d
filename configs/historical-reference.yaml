pathing:
  run_name: example_run
  model_save_dir: ./models/
  results_save_dir: ./results/
  train_img_dirs:
  - ./data/Training_Batch1/media/nas/01_Datasets/CT/LITS/Training Batch 1/
  - ./data/Training_Batch2/media/nas/01_Datasets/CT/LITS/Training Batch 2/
  test_img_dirs: null
dataset:
  batch_size: 3
  resize_img: true
  resize_dims:
    D: 12
    H: 224
    W: 224
  clamp_hu: true
  clamp_hu_range:
    min: -200
    max: 250
  random_hflip: true
  random_hflip_probability: 0.5
  scale_img: true
  scale_img_range:
    min: 0.8
    max: 1.2
  shuffle: true
  sampling: whole_volume
training:
  optimizer: SGD
  learning_rate: 0.01
  epochs: 50
  phase_a_epochs: 100
  phase_a_steps_per_epoch: 10
  phase_b_epochs: 1000
  phase_b_steps_per_epoch: 10
  momentum: 0.5
  use_scheduler: true
  scheduler: StepLR
  scheduler_step: 10
  scheduler_gamma: 0.5
  criterion: CrossEntropyLoss
  class_weights:
    background: 0.2
    liver: 1.2
    lesion: 2.2
  phase_a_targets: liver_only
  loss_reduction: weighted_mean
  step_unit: minibatch_update
  phase_transfer_policy: best_weights_fresh_optimizer
  optimizer_semantics: pytorch_gradient_buffer
  weight_decay: 0.0
  dampening: 0.0
  nesterov: false
runtime:
  wall_seconds: null
  budget_seconds: null
  validation_every: 1
  recovery_every: 1
  heartbeat_seconds: 10
  max_retries: 0
  final_eval_wall_seconds: 300
  final_eval_max_batches: 100
gpu:
  use_gpu: true
  gpu_name: cuda:0
experiment:
  kind: historical_reference
  name: historical_reduced_weighted_mean_liver_only
model:
  name: historical_reduced
  schema_version: 1
  status: historical_deviation
  input_shape:
  - 1
  - 12
  - 224
  - 224
  block_counts:
  - 2
  - 6
  - 12
  - 18
  bottlenecks:
  - 128
  - 128
  - 128
  - 128
  growth: 32
  compression: 0.5
  stem: conv7_stride2_symmetric_pad3_bn_relu
  pool: max2_stride2_valid
  transition: bn_conv1_conv1_stride122
  dense_order: conv1_bn_relu_depthwise3_pointwise1_bn_relu
  decoder: depthwise3_pointwise1_bn_relu
  decoder_widths:
  - 504
  - 224
  - 192
  - 96
  - 64
  skips:
  - dense_block3
  - dense_block2
  - dense_block1
  - stem
  - none
  resize: main_only_trilinear_align_corners_true
  batch_norm:
    eps: 1.0e-05
    momentum: 0.1
    running_variance: unbiased
  initialization: pytorch_conv_reset_parameters
  bias: historical_mixed
  classifier: conv1_3_logits
