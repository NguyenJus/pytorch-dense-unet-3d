---
pathing:
  run_name: example_run
  model_save_dir: ./models/
  results_save_dir: ./results/
  train_img_dirs: 
    - ./data/Training_Batch1/media/nas/01_Datasets/CT/LITS/Training Batch 1/
    - ./data/Training_Batch2/media/nas/01_Datasets/CT/LITS/Training Batch 2/
  test_img_dirs:
    # Must be set to real labeled volume directories for non-dry-run evaluation.
    # The guard in prepare_dataset.py rejects unset/null values at runtime.

dataset:
  batch_size: 3
  resize_img: True
  resize_dims:
    D: 12
    H: 224
    W: 224
  clamp_hu: True
  clamp_hu_range:
    min: -200
    max: 250
  random_hflip: True
  random_hflip_probability: 0.5
  scale_img: True
  scale_img_range:
    min: 0.8
    max: 1.2
  shuffle: True

training:
  optimizer: SGD
  learning_rate: 0.01
  epochs: 50  # Used only by the single-phase Python train() API.
  # CLI train uses the cascaded schedule below; each step is one mini-batch.
  phase_a_epochs: 100
  phase_a_steps_per_epoch: 10
  phase_b_epochs: 1000
  phase_b_steps_per_epoch: 10
  momentum: 0.5
  use_scheduler: True
  scheduler: StepLR
  scheduler_step: 10
  scheduler_gamma: 0.5
  criterion: CrossEntropyLoss
  class_weights:
    background: 0.2
    liver: 1.2
    lesion: 2.2

# Budgets count setup, training, validation, checkpoint I/O and optional final eval.
# Set finite values for overnight allocations; null means explicitly unbounded.
runtime:
  wall_seconds: null
  budget_seconds: null  # Persisted across resumes; cannot silently reset.
  validation_every: 1  # Full validation on these epochs and each phase final epoch.
  recovery_every: 1  # Supported recovery boundary: every completed epoch.
  heartbeat_seconds: 10
  max_retries: 0  # Failed/unknown attempts require explicit bounded recovery.
  final_eval_wall_seconds: 300
  final_eval_max_batches: 100

gpu:
  use_gpu: True
  gpu_name: cuda:0
